name: OpenRouter probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -u - <<'PY'
          import json, os, sys, threading, time
          import requests
          sys.path.insert(0, "scripts")
          import collect

          key = os.environ["OPENROUTER_API_KEY"]
          H = {"Authorization": "Bearer " + key, "Content-Type": "application/json"}
          model = collect.MODEL
          plugin = collect.web_plugin()
          small = [{"role": "user", "content": 'Reply with the JSON {"ok": true}'}]
          real = [
              {"role": "system", "content": collect.COLLECTION_SYSTEM},
              {"role": "user", "content": collect.build_prompt()},
          ]
          RF = {"type": "json_object"}
          def real_body(**extra):
              return dict(messages=real, max_tokens=collect.MAX_OUTPUT_TOKENS, response_format=RF, plugins=plugin, **extra)

          pub = [
              {"role": "system", "content": collect.COLLECTION_SYSTEM},
              {"role": "user", "content": collect.build_publisher_proof_prompt()},
          ]
          PROV = {"sort": "throughput", "ignore": ["OpenInference"]}
          RS = {"enabled": False}
          probes = {
              "K1 sort+ignore+require_parameters+reasoning off": real_body(provider={**PROV, "require_parameters": True}, reasoning=RS),
              "K2 same": real_body(provider={**PROV, "require_parameters": True}, reasoning=RS),
              "K3 same": real_body(provider={**PROV, "require_parameters": True}, reasoning=RS),
              "L sort+ignore+reasoning off, no require_parameters": real_body(provider=PROV, reasoning=RS),
              "M publisher pass with K settings": dict(messages=pub, max_tokens=collect.MAX_OUTPUT_TOKENS, response_format=RF, plugins=collect.web_plugin(collect.PUBLISHER_INCLUDE_DOMAINS), provider={**PROV, "require_parameters": True}, reasoning=RS),
              "N sort=throughput only, 2nd sample": real_body(provider={"sort": "throughput"}),
          }
          out = {}

          def run(name, body):
              t0 = time.monotonic()
              try:
                  r = requests.post(collect.OPENROUTER_URL, headers=H, json={"model": model, **body}, timeout=(10, 230))
                  dt = time.monotonic() - t0
                  try:
                      d = r.json()
                      ch = (d.get("choices") or [{}])[0]
                      txt = (ch.get("message") or {}).get("content") or ""
                      u = d.get("usage") or {}
                      res, _p = collect.extract_collection_json(txt, log=False)
                      parsed = (res or {}).get("status"), len((res or {}).get("findings") or [])
                      info = (f"finish={ch.get('finish_reason')} provider={d.get('provider')} completion={u.get('completion_tokens')} "
                              f"reasoning={(u.get('completion_tokens_details') or {}).get('reasoning_tokens')} chars={len(txt)} parsed={parsed} head={txt[:100]!r}")
                      if r.status_code >= 400:
                          info += f" error={str(d)[:300]}"
                  except ValueError:
                      info = f"non-json body head={r.text[:200]!r}"
                  out[name] = f"HTTP {r.status_code} in {dt:.1f}s {info}"
              except Exception as exc:
                  out[name] = f"FAILED after {time.monotonic() - t0:.1f}s {type(exc).__name__}: {str(exc)[:200]}"

          try:
              r = requests.get(f"https://openrouter.ai/api/v1/models/{model}/endpoints", headers=H, timeout=20)
              print("endpoints HTTP", r.status_code)
              for e in (r.json().get("data") or {}).get("endpoints", []):
                  print("  endpoint", e.get("provider_name"), "status", e.get("status"), "uptime30m", e.get("uptime_last_30m"), "latency", e.get("latency_last_30m"), "throughput", e.get("throughput_last_30m"), "quant", e.get("quantization"))
          except Exception as exc:
              print("endpoints lookup failed:", exc)

          threads = [threading.Thread(target=run, args=(n, b), daemon=True) for n, b in probes.items()]
          for t in threads:
              t.start()
          end = time.monotonic() + 240
          for t in threads:
              t.join(max(0, end - time.monotonic()))
          print("---- results")
          for name in probes:
              print(name, "=>", out.get(name, "STILL RUNNING after 240s"))
          PY
