name: OpenRouter probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe reasoning on and off
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -u - <<'PY'
          import json, os, sys, threading, time
          import requests
          sys.path.insert(0, "scripts")
          import collect

          H = {"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"], "Content-Type": "application/json"}
          real = [
              {"role": "system", "content": collect.COLLECTION_SYSTEM},
              {"role": "user", "content": collect.build_prompt()},
          ]
          base = dict(model=collect.MODEL, messages=real, max_tokens=collect.MAX_OUTPUT_TOKENS,
                      response_format={"type": "json_object"}, plugins=collect.web_plugin(),
                      provider=collect.PROVIDER_PREFERENCES)
          variants = {}
          for i in range(1, 5):
              variants[f"ON  #{i}"] = dict(base)
              variants[f"OFF #{i}"] = dict(base, reasoning={"enabled": False})

          index = collect.load_json(collect.DATA_DIR / "posts-index.json")["posts"]
          heads = {p["id"]: collect.story_tokens(p["title"]) | collect.story_tokens(p["id"].replace("-", " ")) for p in index}
          corpus = collect.load_coverage_corpus().lower()
          out = {}

          def nearest(title):
              t = collect.story_tokens(title)
              best = max(heads, key=lambda k: len(t & heads[k]) / max(1, len(t | heads[k])))
              return best, len(t & heads[best]) / max(1, len(t | heads[best]))

          def run(name, body):
              t0 = time.monotonic()
              try:
                  r = requests.post(collect.OPENROUTER_URL, headers=H, json=body, timeout=(10, 230))
                  d = r.json()
                  ch = (d.get("choices") or [{}])[0]
                  txt = (ch.get("message") or {}).get("content") or ""
                  u = d.get("usage") or {}
                  res, _p = collect.extract_collection_json(txt, log=False)
                  lines = [f"HTTP {r.status_code} {time.monotonic() - t0:.0f}s finish={ch.get('finish_reason')} provider={d.get('provider')} "
                           f"reasoning={(u.get('completion_tokens_details') or {}).get('reasoning_tokens')} status={(res or {}).get('status')}"]
                  for f in (res or {}).get("findings") or []:
                      refs = [x.get("url", "") for x in f.get("references") or []]
                      cited = [x for x in refs if collect.coverage_needle(x) and collect.coverage_needle(x) in corpus]
                      near, score = nearest(f.get("title", ""))
                      lines.append(f"    - {f.get('title')}")
                      lines.append(f"        refs cited already: {len(cited)}/{len(refs)}  nearest existing: {near} ({score:.2f})")
                  out[name] = "\n".join(lines)
              except Exception as exc:
                  out[name] = f"FAILED {time.monotonic() - t0:.0f}s {type(exc).__name__}: {str(exc)[:200]}"

          threads = [threading.Thread(target=run, args=(n, b), daemon=True) for n, b in variants.items()]
          for t in threads:
              t.start()
          end = time.monotonic() + 250
          for t in threads:
              t.join(max(0, end - time.monotonic()))
          print("---- results")
          for n in variants:
              print("[" + n + "]", out.get(n, "STILL RUNNING after 250s"))
          PY
